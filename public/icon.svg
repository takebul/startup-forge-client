<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StartupForge">
  <!--
    StartupForge favicon (SVG). Compact 100x100 version of the 512px brand mark:
    rounded-square tile, diagonal violet -> purple -> indigo gradient, white
    lucide "Rocket" glyph. Proportional to public/logo.svg (scale 100/512).
  -->
  <defs>
    <linearGradient id="sf-icon-tile" x1="7.8" y1="92.2" x2="92.2" y2="7.8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="sf-icon-gloss" cx="0.3" cy="0.2" r="0.9">
      <stop stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Gradient tile + subtle top-left gloss -->
  <rect width="100" height="100" rx="22.3" fill="url(#sf-icon-tile)"/>
  <rect width="100" height="100" rx="22.3" fill="url(#sf-icon-gloss)"/>

  <!-- White rocket glyph (lucide Rocket), proportional to logo.svg -->
  <g transform="translate(20.7 20.7) scale(2.44)" fill="none" stroke="#FFFFFF"
     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09"/>
    <path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z"/>
    <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05"/>
  </g>
</svg>
