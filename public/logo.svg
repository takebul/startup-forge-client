<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StartupForge">
  <!--
    StartupForge brand mark.
    Mirrors the app favicon and navbar logo: a rounded-square tile with a diagonal
    violet -> purple -> indigo gradient (Tailwind violet-600 / purple-600 / indigo-600)
    and a white lucide "Rocket" glyph.
  -->
  <defs>
    <linearGradient id="sf-tile" x1="40" y1="472" x2="472" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="sf-gloss" cx="0.3" cy="0.2" r="0.9">
      <stop stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Gradient tile + subtle top-left gloss for depth -->
  <rect width="512" height="512" rx="114" fill="url(#sf-tile)"/>
  <rect width="512" height="512" rx="114" fill="url(#sf-gloss)"/>

  <!-- White rocket glyph (lucide Rocket), scaled 12.5x and centered -->
  <g transform="translate(106 106) scale(12.5)" fill="none" stroke="#FFFFFF"
     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09"/>
    <path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z"/>
    <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05"/>
  </g>
</svg>
