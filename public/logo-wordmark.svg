<svg width="380" height="96" viewBox="0 0 380 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StartupForge">
  <!--
    StartupForge horizontal lockup: brand mark + wordmark.
    "Startup" in slate-900, "Forge" in violet-600, matching the site navbar.
    Colors target a light background; the gradient tile reads well on light or dark.
  -->
  <defs>
    <linearGradient id="sf-wm-tile" x1="12" y1="84" x2="84" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="sf-wm-gloss" cx="0.3" cy="0.2" r="0.9">
      <stop stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mark tile (72x72) -->
  <rect x="12" y="12" width="72" height="72" rx="18" fill="url(#sf-wm-tile)"/>
  <rect x="12" y="12" width="72" height="72" rx="18" fill="url(#sf-wm-gloss)"/>

  <!-- White rocket glyph (lucide Rocket), centered in the tile -->
  <g transform="translate(27 27) scale(1.75)" fill="none" stroke="#FFFFFF"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09"/>
    <path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z"/>
    <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05"/>
  </g>

  <!-- Wordmark -->
  <text x="100" y="62"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="800" letter-spacing="-1.2">
    <tspan fill="#0F172A">Startup</tspan><tspan fill="#7C3AED">Forge</tspan>
  </text>
</svg>
